# CI for the shopper-facing app. Deployment is done by Amplify Hosting
# (AMPLIFY_MONOREPO_APP_ROOT=apps/storefront); this workflow is the PR gate.
# Runs when the storefront or any package it imports changes.

name: storefront

on:
  # Every pull request: these jobs are required status checks on main, and a
  # required check that never runs (path filter not matched) blocks the merge.
  pull_request:
  push:
    branches: [main]
    paths:
      - "apps/storefront/**"
      - "packages/core/**"
      - "packages/ui/**"
      - "vitest.config.mts"
      - "vitest.setup.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/storefront.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storefront-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job name is the required status check in the main ruleset: keep it unique across workflows.
  storefront-check:
    runs-on: ubuntu-latest
    env:
      # Module-load placeholders only: nothing connects during a build.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-only-secret
      NEXT_PUBLIC_STOREFRONT_URL: https://storefront.example
      NEXT_PUBLIC_ADMIN_URL: https://admin.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w apps/storefront
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: test-results/junit.xml
          if-no-files-found: ignore
      - run: npm run build -w apps/storefront
